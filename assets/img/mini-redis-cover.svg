<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Mini Redis distributed cache architecture diagram">
  <title>Mini Redis distributed cache architecture</title>
  <desc>Client requests are hashed by a cluster manager to a leader shard running an LRU/TTL cache backed by RDB snapshot and AOF persistence, replicated to a follower, with pub/sub for messaging</desc>

  <rect width="960" height="300" fill="#0b1220"/>

  <text x="32" y="40" fill="#2dd4bf" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">DISTRIBUTED CACHE</text>

  <!-- Client -->
  <rect x="24" y="95" width="100" height="60" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="74" y="122" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Client</text>
  <text x="74" y="138" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">SET / GET</text>

  <!-- Cluster Manager -->
  <rect x="170" y="75" width="180" height="100" rx="8" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="260" y="103" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Cluster Manager</text>
  <text x="260" y="123" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">consistent hashing</text>
  <text x="260" y="139" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">virtual nodes</text>

  <!-- Shard Node (Leader) -->
  <rect x="396" y="55" width="200" height="120" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="496" y="83" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Shard Node (Leader)</text>
  <text x="496" y="105" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">LRU eviction + TTL</text>
  <text x="496" y="122" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">capacity-bound cache</text>

  <!-- Persistence -->
  <rect x="396" y="195" width="200" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.3"/>
  <text x="496" y="218" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Persistence</text>
  <text x="496" y="236" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">RDB snapshot + AOF</text>

  <!-- Follower -->
  <rect x="632" y="55" width="150" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.3"/>
  <text x="707" y="80" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Follower</text>
  <text x="707" y="98" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">replication</text>

  <!-- Pub/Sub -->
  <rect x="632" y="140" width="150" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.3"/>
  <text x="707" y="163" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Pub/Sub</text>
  <text x="707" y="181" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">channels</text>

  <!-- Arrows -->
  <line x1="124" y1="125" x2="170" y2="125" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="170,125 162,121 162,129" fill="#2dd4bf"/>

  <line x1="350" y1="120" x2="396" y2="112" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="396,112 387,111 390,119" fill="#2dd4bf"/>

  <line x1="496" y1="175" x2="496" y2="195" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="496,195 492,187 500,187" fill="#38bdf8"/>

  <line x1="596" y1="90" x2="632" y2="85" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="632,85 623,83 625,91" fill="#38bdf8"/>

  <line x1="596" y1="150" x2="632" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="632,160 623,157 621,165" fill="#38bdf8"/>

  <text x="32" y="272" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">ClusterManager hashes keys to shards using virtual nodes for even distribution.</text>
  <text x="32" y="290" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">Features: LRU eviction · TTL · RDB snapshot + AOF · leader-follower replication · consistent hashing · pub/sub</text>
</svg>
