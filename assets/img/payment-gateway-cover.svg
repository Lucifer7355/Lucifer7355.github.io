<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Multi service payment platform architecture diagram">
  <title>Payment gateway architecture</title>
  <desc>Clearflow console through a proxy to the payment service which runs fraud check and ledger reserve then a simulated gateway confirm with outbox and saga compensation</desc>

  <rect width="960" height="300" fill="#0b1220"/>

  <text x="32" y="40" fill="#2dd4bf" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PAYMENT GATEWAY</text>

  <!-- Clearflow -->
  <rect x="32" y="110" width="130" height="80" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="97" y="138" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Clearflow</text>
  <text x="97" y="156" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">Angular · :4200</text>
  <text x="97" y="172" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">via local proxy</text>

  <!-- Payment Service -->
  <rect x="192" y="95" width="170" height="110" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="277" y="138" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Payment Service</text>
  <text x="277" y="156" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">confirm saga · :8084</text>
  <text x="277" y="172" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">idempotent + lock retry</text>

  <!-- Fraud + Ledger -->
  <rect x="392" y="105" width="170" height="90" rx="8" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="477" y="132" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Fraud + Ledger</text>
  <text x="477" y="150" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">fraud check · :8089</text>
  <text x="477" y="166" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">ledger reserve · :8086</text>

  <!-- Simulated Gateway -->
  <rect x="592" y="95" width="170" height="110" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="677" y="138" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Simulated Gateway</text>
  <text x="677" y="156" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">confirm attempt</text>
  <text x="677" y="172" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">then SUCCEEDED</text>

  <!-- Outbox + Saga -->
  <rect x="792" y="105" width="140" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.3"/>
  <text x="862" y="132" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Outbox + Saga</text>
  <text x="862" y="150" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="9">commit and event</text>
  <text x="862" y="164" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="9">together, compensate on fail</text>

  <!-- Arrows -->
  <line x1="162" y1="150" x2="192" y2="150" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="192,150 184,146 184,154" fill="#2dd4bf"/>

  <line x1="362" y1="150" x2="392" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="392,150 384,146 384,154" fill="#38bdf8"/>

  <line x1="562" y1="150" x2="592" y2="150" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="592,150 584,146 584,154" fill="#2dd4bf"/>

  <line x1="762" y1="150" x2="792" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="792,150 784,146 784,154" fill="#38bdf8"/>

  <text x="32" y="255" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">Confirm runs fraud check then ledger reserve then a simulated gateway confirm, with saga compensation if a step fails.</text>
  <text x="32" y="277" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">13 services total: auth, merchant, customer, wallet, settlement, reconciliation, refund, notification, webhook, analytics.</text>
</svg>
