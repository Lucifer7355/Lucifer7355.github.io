<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Collaborative docs editor architecture diagram">
  <title>Collaborative docs editor architecture</title>
  <desc>Browser A and Browser B each hold a Yjs document synced through a WebSocket relay server with disk persistence and offline IndexedDB mirroring</desc>

  <rect width="960" height="300" fill="#0b1220"/>

  <text x="32" y="40" fill="#2dd4bf" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">COLLABORATIVE DOCS EDITOR</text>

  <!-- Browser A -->
  <rect x="32" y="100" width="160" height="100" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="112" y="128" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Browser A</text>
  <text x="112" y="146" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">Lexical + Y.Doc</text>
  <text x="112" y="162" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">IndexedDB mirror</text>
  <text x="112" y="180" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">works offline</text>

  <!-- Yjs WS Server -->
  <rect x="242" y="85" width="190" height="130" rx="8" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="337" y="118" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Yjs WS Server</text>
  <text x="337" y="138" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">rooms + awareness</text>
  <text x="337" y="154" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">relay, not merge authority</text>
  <text x="337" y="170" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">sync protocol on connect</text>
  <text x="337" y="186" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">/ws/&lt;docId&gt;</text>

  <!-- Persistence -->
  <rect x="472" y="100" width="170" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.3"/>
  <text x="557" y="126" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Persistence</text>
  <text x="557" y="144" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="9">data/docs/&lt;id&gt;/state.yjs</text>
  <text x="557" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="9">version snapshots</text>
  <text x="557" y="176" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="9">restore writes disk + reload</text>

  <!-- Browser B -->
  <rect x="768" y="100" width="160" height="100" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="848" y="128" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Browser B</text>
  <text x="848" y="146" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">Lexical + Y.Doc</text>
  <text x="848" y="162" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">live cursors</text>
  <text x="848" y="180" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">presence</text>

  <!-- Arrows -->
  <line x1="192" y1="150" x2="242" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="242,150 234,146 234,154" fill="#38bdf8"/>
  <line x1="242" y1="160" x2="192" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="192,160 200,156 200,164" fill="#38bdf8"/>

  <line x1="432" y1="150" x2="472" y2="150" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="472,150 464,146 464,154" fill="#2dd4bf"/>

  <line x1="642" y1="150" x2="738" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="738,150 730,146 730,154" fill="#38bdf8"/>
  <line x1="738" y1="160" x2="642" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="642,160 650,156 650,164" fill="#38bdf8"/>

  <text x="32" y="248" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">Updates are binary Yjs blobs that commute, so applying them in any order still converges.</text>
  <text x="32" y="270" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">Offline edits queue in IndexedDB and resync automatically once the WebSocket reconnects.</text>
</svg>
