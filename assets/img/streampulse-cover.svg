<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="StreamPulse architecture diagram">
  <title>StreamPulse architecture</title>
  <desc>Producer to Kafka to Processor/Flink to ClickHouse to API and Dashboard</desc>

  <rect width="960" height="300" fill="#0b1220"/>

  <text x="32" y="40" fill="#2dd4bf" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">STREAMPULSE</text>

  <!-- boxes -->
  <rect x="40" y="90" width="130" height="60" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="105" y="116" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Producer</text>
  <text x="105" y="134" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11">events</text>

  <rect x="220" y="90" width="130" height="60" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="285" y="116" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Kafka</text>
  <text x="285" y="134" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11">KRaft topics</text>

  <rect x="400" y="55" width="150" height="56" rx="8" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="475" y="80" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Processor</text>
  <text x="475" y="98" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11">windows + fraud</text>

  <rect x="400" y="130" width="150" height="56" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="475" y="155" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Flink</text>
  <text x="475" y="173" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11">JM/TM + SQL</text>

  <rect x="600" y="90" width="130" height="60" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="665" y="116" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">ClickHouse</text>
  <text x="665" y="134" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11">OLAP + MVs</text>

  <rect x="780" y="90" width="140" height="60" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="850" y="116" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">API + UI</text>
  <text x="850" y="134" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11">live dashboard</text>

  <!-- arrows (solid strokes; no gradient urls - safer for GitHub camo) -->
  <line x1="170" y1="120" x2="220" y2="120" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="220,120 212,116 212,124" fill="#2dd4bf"/>

  <line x1="350" y1="120" x2="400" y2="120" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="400,120 392,116 392,124" fill="#2dd4bf"/>

  <path d="M550 83 H575 V120 H600" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="600,120 592,116 592,124" fill="#2dd4bf"/>

  <path d="M550 158 H575 V120" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <line x1="730" y1="120" x2="780" y2="120" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="780,120 772,116 772,124" fill="#2dd4bf"/>

  <text x="32" y="240" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">Raw events -&gt; stream processing -&gt; OLAP store -&gt; query and visualize</text>
  <text x="32" y="262" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">Topics: commerce.events.raw | metrics.minute | sessions | alerts.fraud | dlq</text>
</svg>
