<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Realtime multiplayer canvas editor architecture diagram">
  <title>Realtime canvas editor architecture</title>
  <desc>Browser A and Browser B each render shapes with Konva and Zustand, synced through a WebSocket room server that persists shapes and version snapshots to disk</desc>

  <rect width="960" height="300" fill="#0b1220"/>

  <text x="32" y="40" fill="#2dd4bf" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">REALTIME CANVAS EDITOR</text>

  <!-- Browser A -->
  <rect x="32" y="100" width="160" height="100" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="112" y="128" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Browser A</text>
  <text x="112" y="146" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">React + Konva</text>
  <text x="112" y="162" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">Zustand store</text>
  <text x="112" y="180" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">camera stays local</text>

  <!-- WS Room Server -->
  <rect x="242" y="85" width="190" height="130" rx="8" fill="#111827" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="337" y="118" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">WS Room Server</text>
  <text x="337" y="138" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">shapes Map + versions[]</text>
  <text x="337" y="154" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">presence + cursors</text>
  <text x="337" y="170" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">last-write-wins per shape</text>
  <text x="337" y="186" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">Express :3001, /ws</text>

  <!-- Persistence -->
  <rect x="472" y="100" width="170" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.3"/>
  <text x="557" y="126" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Persistence</text>
  <text x="557" y="144" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="9">data/room-state.json</text>
  <text x="557" y="160" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="9">named version snapshots</text>
  <text x="557" y="176" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="9">capped at 50, restorable</text>

  <!-- Browser B -->
  <rect x="768" y="100" width="160" height="100" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="848" y="128" text-anchor="middle" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Browser B</text>
  <text x="848" y="146" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">React + Konva</text>
  <text x="848" y="162" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">remote cursors</text>
  <text x="848" y="180" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="10">tinted selections</text>

  <!-- Arrows -->
  <line x1="192" y1="150" x2="242" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="242,150 234,146 234,154" fill="#38bdf8"/>
  <line x1="242" y1="160" x2="192" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="192,160 200,156 200,164" fill="#38bdf8"/>

  <line x1="432" y1="150" x2="472" y2="150" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="472,150 464,146 464,154" fill="#2dd4bf"/>

  <line x1="642" y1="150" x2="738" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="738,150 730,146 730,154" fill="#38bdf8"/>
  <line x1="738" y1="160" x2="642" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="642,160 650,156 650,164" fill="#38bdf8"/>

  <text x="32" y="248" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">No OT or CRDT here. Shapes are last-write-wins, which is fine for a small room but not for multi-team scale.</text>
  <text x="32" y="270" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="12">Camera position stays client only, while shapes, presence, and version snapshots sync over one WebSocket room.</text>
</svg>
